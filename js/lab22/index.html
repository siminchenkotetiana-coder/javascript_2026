<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ЛР 22. Варіант 13</title>
  <link rel="stylesheet" href="style.css">
<head>
    <h2>Форма зворотного зв'язку</h2>

    <form id="myForm">
        <input type="text" id="userName" placeholder="Введіть ім'я" required>
        <input type="email" id="userEmail" placeholder="Введіть email" required>
        <button type="submit">Відправити</button>
    </form>

    <script>
        const form = document.getElementById("myForm");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            // Отримуємо ім'я користувача
            const name = document.getElementById("userName").value;

            // Виводимо повідомлення
            alert(`Форму успішно відправлено! Дякуємо, ${name}.`);

            form.reset();
        });
    </script>

</body>
</html>
