<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab 31-32</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .container {
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        text-align: center;
        width: 400px;
    }

    h2 {
        color: #333;
        margin-bottom: 20px;
    }

    button {
        background: #007bff;
        color: white;
        border: none;
        padding: 12px 25px;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #0056b3;
        transform: scale(1.05);
    }

    #result {
        margin-top: 20px;
        font-size: 18px;
        font-weight: bold;
        color: #28a745;
        min-height: 30px;
    }

    .loading {
        color: #ff9800;
    }
</style>
</head>

<body>

<div class="container">
    <h2>Promise.race()</h2>

    <button onclick="startRace()">
        Запустити
    </button>

    <p id="result"></p>
</div>

<script>
function startRace() {

    const result = document.getElementById("result");

    result.className = "loading";
    result.textContent = "Виконується очікування...";

    const promise1 = new Promise((resolve) => {
        setTimeout(() => {
            resolve("Проміс 1 завершився через 3000 мс");
        }, 3000);
    });

    const promise2 = new Promise((resolve) => {
        setTimeout(() => {
            resolve("Проміс 2 завершився через 1000 мс");
        }, 1000);
    });

    const promise3 = new Promise((resolve) => {
        setTimeout(() => {
            resolve("Проміс 3 завершився через 2000 мс");
        }, 2000);
    });

    Promise.race([promise1, promise2, promise3])
        .then(data => {
            result.className = "";
            result.textContent = "Переможець: " + data;
        })
        .catch(error => {
            result.style.color = "red";
            result.textContent = "Помилка: " + error;
        });
}
</script>

</body>
</html>
